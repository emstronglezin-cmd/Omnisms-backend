# ════════════════════════════════════════════════════════════════
# OmniSMS Backend — Configuration Render.com — v4.1
# ════════════════════════════════════════════════════════════════
#
# ⚙️  Setup initial :
#  1. Connectez votre repo GitHub sur https://render.com
#  2. New → Web Service → connecter le repo
#  3. Render détecte ce fichier automatiquement
#  4. Ajoutez les variables d'environnement sensibles dans
#     Dashboard → Service → Settings → Environment
#
# 🔄 Auto-deploy : chaque push sur main déclenche un redéploiement
#
# 💳 Paiement : SasPay (Mobile Money + Carte)
#   Webhook URL : https://omnisms-backend.onrender.com/api/payment/webhook/leekpay
#   Configurer dans : https://app.saspay.me → Développeur → Clés API
#
# 📊 Health check : GET /health
# ════════════════════════════════════════════════════════════════

services:
  - type: web
    name: omnisms-backend
    runtime: node
    plan: free          # Changer en "starter" pour la production

    branch: main
    buildCommand: npm ci --omit=dev
    startCommand: npm start

    # Health check (Render attend HTTP 200 avant de router le trafic)
    healthCheckPath: /health

    envVars:
      # ── Serveur ────────────────────────────────────────────
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 10000    # Render utilise le port 10000 par défaut

      - key: LOG_LEVEL
        value: info     # debug | info | warn | error

      # ── URLs ───────────────────────────────────────────────
      - key: BACKEND_URL
        fromService:
          type: web
          name: omnisms-backend
          property: host

      # URL du frontend (redirection après paiement réussi/annulé)
      - key: FRONTEND_URL
        sync: false     # https://omnisms.netlify.app ou GitHub Pages

      # ── Variables sensibles (saisir manuellement dans Render) ──

      - key: JWT_SECRET
        sync: false     # Secret JWT long et aléatoire (min 32 chars)

      # ── Google OAuth (Google Cloud Console → OAuth client Web) ──
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://omnisms-backend.onrender.com/api/auth/google/callback
      - key: GOOGLE_CONTACTS_REDIRECT_URI
        value: https://omnisms-backend.onrender.com/api/auth/google/contacts/callback
      - key: GOOGLE_FLUTTER_REDIRECT_URI
        value: omnisms://auth/google/callback
      - key: GOOGLE_CONTACTS_FLUTTER_REDIRECT_URI
        value: omnisms://auth/google/contacts/callback
      - key: GOOGLE_TOKEN_ENCRYPTION_KEY
        sync: false     # openssl rand -base64 32

      - key: ADMIN_KEY
        sync: false     # Clé admin secrète

      - key: API_KEY
        sync: false     # Clé API interne optionnelle

      # ── Firebase (OBLIGATOIRE) ─────────────────────────────
      # JSON complet du service account Firebase, sur une seule ligne.
      # console.firebase.google.com → Paramètres → Comptes de service
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false

      # ── SasPay (Paiements — Mobile Money & Carte) ────────────
      # Clés API : https://app.saspay.me → Développeur

      # ⚠️ NOMS EXACTS attendus par le code (services/saaspay.js)

      # Clé API secrète SasPay (sk_live_... / sk_test_...) — appels serveur uniquement
      - key: SAASPAY_SECRET_KEY
        sync: false

      # SasPay utilise un signing_secret distinct, configuré après création du webhook.
      - key: SAASPAY_WEBHOOK_SECRET
        sync: false

      # URL API officielle, explicitement fixée pour éviter un override Render obsolète.
      - key: SAASPAY_BASE_URL
        value: https://api.saspay.me

      # Montant abonnement Premium (défaut 2000)
      - key: SAASPAY_PREMIUM_AMOUNT
        value: "2000"

      # Devise (XOF | EUR | USD)
      - key: SAASPAY_PREMIUM_CURRENCY
        value: XOF

      # ── Redis (BullMQ + Async Jobs) ──────────────────────────
      # Render → Add-ons → Redis (plan gratuit disponible)
      - key: REDIS_URL
        sync: false

      # ── Infobip SMS ─────────────────────────────────────────
      - key: INFOBIP_API_KEY
        sync: false

      - key: INFOBIP_BASE_URL
        sync: false

      - key: INFOBIP_SENDER_ID
        value: OmniSMS

      # ── Transcription Audio ───────────────────────────────────
      # OPTION 1 (recommandée) : Groq Whisper API — gratuit, ultra-rapide
      # Créez une clé GRATUITE sur https://console.groq.com
      - key: GROQ_API_KEY
        sync: false

      - key: GROQ_WHISPER_MODEL
        value: whisper-large-v3-turbo

      # OPTION 2 : Faster-Whisper service Python séparé (optionnel)
      - key: WHISPER_SERVICE_URL
        sync: false

      - key: WHISPER_MODEL
        value: small

      - key: WHISPER_LANGUAGE
        value: fr

      - key: WHISPER_DEVICE
        value: cpu

      # ── Téléphonie ───────────────────────────────────────────
      - key: DEFAULT_PHONE_COUNTRY
        value: BF

      # UIDs Firebase des admins (séparés par virgule)
      - key: ADMIN_UIDS
        sync: false

      # ── CORS ───────────────────────────────────────────────
      - key: CORS_ORIGIN
        value: "https://omnisms.netlify.app,https://omnisms.web.app"
