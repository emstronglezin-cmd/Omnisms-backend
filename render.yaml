# ════════════════════════════════════════════════════════════════
# OmniSMS Backend — Configuration Render.com — v4.1
# ════════════════════════════════════════════════════════════════
#
# ⚙️  Setup initial :
#  1. Connectez votre repo GitHub sur https://render.com
#  2. New → Web Service → connecter le repo
#  3. Render détecte ce fichier automatiquement
#  4. Ajoutez les variables d'environnement sensibles dans
#     Dashboard → Service → Settings → Environment
#
# 🔄 Auto-deploy : chaque push sur main déclenche un redéploiement
#
# 💳 Paiement : LeekPay.me (Mobile Money + Carte)
#   Webhook URL : https://omnisms-backend.onrender.com/api/payment/webhook/leekpay
#   Configurer dans : https://www.leekpay.me → Dashboard → Clés API
#
# 📊 Health check : GET /health
# ════════════════════════════════════════════════════════════════

services:
  - type: web
    name: omnisms-backend
    runtime: node
    plan: free          # Changer en "starter" pour la production

    branch: main
    buildCommand: npm ci --omit=dev
    startCommand: npm start

    # Health check (Render attend HTTP 200 avant de router le trafic)
    healthCheckPath: /health

    envVars:
      # ── Serveur ────────────────────────────────────────────
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 10000    # Render utilise le port 10000 par défaut

      - key: LOG_LEVEL
        value: info     # debug | info | warn | error

      # ── URLs ───────────────────────────────────────────────
      - key: BACKEND_URL
        fromService:
          type: web
          name: omnisms-backend
          property: host

      # URL du frontend (redirection après paiement réussi/annulé)
      - key: FRONTEND_URL
        sync: false     # https://omnisms.netlify.app ou GitHub Pages

      # ── Variables sensibles (saisir manuellement dans Render) ──

      - key: JWT_SECRET
        sync: false     # Secret JWT long et aléatoire (min 32 chars)

      - key: ADMIN_KEY
        sync: false     # Clé admin secrète

      - key: API_KEY
        sync: false     # Clé API interne optionnelle

      # ── Firebase (OBLIGATOIRE) ─────────────────────────────
      # JSON complet du service account Firebase, sur une seule ligne.
      # console.firebase.google.com → Paramètres → Comptes de service
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false

      # ── LeekPay (Paiements — Mobile Money & Carte) ─────────
      # Créez votre compte : https://www.leekpay.me/register
      # Dashboard → Clés API → Nouvelle clé API

      # Clé publique (pk_live_xxx) — aussi utilisée pour signature webhook
      - key: LEEKPAY_API_KEY
        sync: false

      # Clé secrète (sk_live_xxx) — JAMAIS exposée côté client
      - key: LEEKPAY_SECRET_KEY
        sync: false

      # URL base API LeekPay (ne pas modifier sauf sandbox)
      - key: LEEKPAY_BASE_URL
        value: https://leekpay.fr

      # Secret webhook optionnel (si vide, LEEKPAY_API_KEY est utilisée)
      - key: LEEKPAY_WEBHOOK_SECRET
        sync: false

      # Montant abonnement Premium (défaut 2000)
      - key: LEEKPAY_PREMIUM_AMOUNT
        value: "2000"

      # Devise (XOF | EUR | USD)
      - key: LEEKPAY_PREMIUM_CURRENCY
        value: XOF

      # ── Redis (BullMQ + Async Jobs) ──────────────────────────
      # Render → Add-ons → Redis (plan gratuit disponible)
      - key: REDIS_URL
        sync: false

      # ── Infobip SMS ─────────────────────────────────────────
      - key: INFOBIP_API_KEY
        sync: false

      - key: INFOBIP_BASE_URL
        sync: false

      - key: INFOBIP_SENDER_ID
        value: OmniSMS

      # ── Transcription Audio (Faster-Whisper) ─────────────────
      - key: WHISPER_SERVICE_URL
        sync: false

      - key: WHISPER_MODEL
        value: small

      - key: WHISPER_LANGUAGE
        value: fr

      - key: WHISPER_DEVICE
        value: cpu

      # ── Téléphonie ───────────────────────────────────────────
      - key: DEFAULT_PHONE_COUNTRY
        value: BF

      # UIDs Firebase des admins (séparés par virgule)
      - key: ADMIN_UIDS
        sync: false

      # ── CORS ───────────────────────────────────────────────
      - key: CORS_ORIGIN
        value: "https://omnisms.netlify.app,https://omnisms.web.app"
